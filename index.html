<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7B1E8F">
<meta name="robots" content="noindex, nofollow">
<title>بلاغات الركاب بدون تذاكر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --p:#7B1E8F; --p2:#9B3BB0; --pl:#F5EFF8; --pl2:#E9DDF0;
  --ink:#1A1F2E; --mut:#6B7280; --line:#E5E7EB; --bg:#F6F5F8; --card:#fff;
  --ok:#2E7D5B; --warn:#B26A00; --bad:#B3261E; --blue:#1F5FA8;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Noto Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--p)}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
div.num,td.num{text-align:right}

/* top bar */
.top{background:#fff;border-top:6px solid var(--p);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-size:26px;color:var(--p);font-weight:800;letter-spacing:.5px;font-family:system-ui,sans-serif}
.brand div{line-height:1.25}
.brand .t1{font-weight:700;font-size:15px}
.brand .t2{font-size:12px;color:var(--mut)}
.proto{font-size:11px;background:#FFF4D6;color:#7A5300;border:1px solid #F1D48A;border-radius:99px;padding:2px 9px;font-weight:600}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)}
.who select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;color:var(--ink);max-width:230px}
.tabs{max-width:1120px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;color:var(--mut);font-weight:600;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--p);border-bottom-color:var(--p)}
.tab .cnt{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;margin-inline-start:4px}

main{max-width:1120px;margin:0 auto;padding:18px 16px 60px}
h2.sec{display:flex;align-items:center;gap:10px;font-size:19px;margin:22px 0 12px}
h2.sec:before{content:"";width:5px;height:24px;background:var(--p);border-radius:1px}

/* stats strip */
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .l{font-size:12px;color:var(--mut);font-weight:600}
.stat .v{font-size:26px;font-weight:800;margin-top:2px}
@media(max-width:640px){.strip{grid-template-columns:repeat(2,1fr)}}

/* toolbar */
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0 10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;cursor:pointer;font-size:13px;font-weight:600;color:var(--mut)}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.search{flex:1;min-width:180px;border:1px solid var(--line);border-radius:99px;padding:7px 14px;background:#fff}

/* case cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.cc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;position:relative}
.cc.new{border-color:#F3B7B2;box-shadow:0 0 0 3px #FDECEA}
.cc-h{display:flex;align-items:center;gap:8px}
.cid{font-weight:800;color:var(--p);font-family:system-ui,sans-serif}
.st{font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;white-space:nowrap}
.elapsed{margin-inline-start:auto;font-size:12px;color:var(--mut)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13.5px}
.kv .k{font-size:11.5px;color:var(--mut);font-weight:600;display:block}
.kv .full{grid-column:1/-1}
.acts{display:flex;gap:8px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;font-weight:600;cursor:pointer;font-size:13.5px;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--p2)}
.btn.pri{background:var(--p);border-color:var(--p);color:#fff}
.btn.pri:hover{background:var(--p2)}
.btn.ghost{border-color:transparent;background:var(--pl);color:var(--p)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.outs{display:flex;gap:5px;flex-wrap:wrap}
.ob{font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 8px;color:#fff}
.empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:40px;text-align:center;color:var(--mut)}

/* forms */
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--mut)}
label.f input,label.f select,label.f textarea,textarea.paste{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;color:var(--ink);font-weight:400;font-size:14.5px}
label.f input:focus,textarea:focus,select:focus{outline:2px solid var(--pl2);border-color:var(--p2)}
textarea.paste{width:100%;min-height:170px;resize:vertical;line-height:1.7}
.hint{font-size:12.5px;color:var(--mut)}
.parsed{font-size:12.5px;color:var(--ok);font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:860px){.two{grid-template-columns:1fr}}

/* modal */
.ov{position:fixed;inset:0;background:rgba(20,16,30,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:12px}
@media(min-width:700px){.ov{align-items:center}}
.md{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:18px}
.md h3{margin:0 0 4px;font-size:18px}
.md .sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.opt{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:7px;cursor:pointer;font-weight:500}
.opt input{accent-color:var(--p);width:17px;height:17px}
.opt.on{border-color:var(--p2);background:var(--pl)}
.wa{background:#F0FAF3;border:1px solid #CBE9D4;border-radius:12px;padding:12px;white-space:pre-wrap;font-size:14px;line-height:1.8;width:100%;min-height:150px;resize:vertical;color:var(--ink)}
.drop{border:2px dashed var(--pl2);border-radius:12px;padding:14px;text-align:center;color:var(--mut);cursor:pointer;display:block}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:99px;font-size:13.5px;z-index:60;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}

/* ===== report (A1206 style) ===== */
.rep-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.rep{background:#fff;max-width:900px;margin:0 auto;border-top:10px solid var(--p);box-shadow:0 2px 16px rgba(30,10,40,.08);padding:34px 46px 44px}
@media(max-width:640px){.rep{padding:22px 18px 30px}}
.rh{display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid #8B93A1;padding-bottom:16px}
.rh .logo{font-family:system-ui,sans-serif;font-weight:800;font-size:34px;color:var(--p);line-height:1}
.rh .co{line-height:1.3}
.rh .co b{font-size:16px;display:block}
.rh .co span{font-size:12.5px;color:var(--mut)}
.rh .case{margin-inline-start:auto;color:var(--p);font-weight:800;font-family:system-ui,sans-serif;font-size:15px;padding-top:6px}
.rt{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin:26px 0 18px}
.rt h1{margin:0;font-size:32px;font-weight:800;line-height:1.2}
.rt .gen{font-size:12.5px;color:var(--mut)}
.band{background:var(--pl);padding:16px 18px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:640px){.band{grid-template-columns:1fr 1fr}}
.band .k,.snap .k{font-size:11.5px;color:var(--mut);font-weight:700}
.band .v{font-size:15px;margin-top:2px}
.rs{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:700;margin:30px 0 16px}
.rs:before{content:"";width:7px;height:34px;background:var(--p)}
.snap{display:grid;grid-template-columns:1fr 1fr;gap:14px 40px;padding:0 14px}
@media(max-width:640px){.snap{grid-template-columns:1fr}}
.snap .v{font-size:15px;word-break:break-word}
.tl{display:grid;grid-template-columns:repeat(6,1fr);padding:0 10px;margin-top:6px}
@media(max-width:640px){.tl{grid-template-columns:repeat(3,1fr);row-gap:20px}}
.tl .s{position:relative;padding-top:24px}
.tl .s:before{content:"";position:absolute;top:6px;right:0;left:0;height:2px;background:var(--pl2)}
.tl .s:first-child:before{right:7px}
.tl .s:last-child:before{left:auto;width:7px}
.tl .dot{position:absolute;top:0;right:0;width:14px;height:14px;border-radius:50%;background:#D5BCE0}
.tl .s.end .dot{background:var(--p)}
.tl .s.skip .dot{background:#fff;border:2px dashed #CBB6D6}
.tl .lb{font-size:13px;font-weight:700}
.tl .tm{font-size:12px;color:var(--mut)}
.tl .du{font-size:11px;color:var(--p);font-weight:700}
.narr{padding:0 12px}
.narr .k{color:var(--p);font-weight:700;font-size:14.5px;margin-top:14px}
.narr .v{margin-top:4px}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:22px 34px;padding:0 4px}
.photos figure{margin:0}
.photos img{width:100%;height:260px;object-fit:contain;background:#FAFAFB}
.photos figcaption{font-size:12px;color:var(--mut);margin-top:4px;direction:ltr;text-align:left}
.pb{display:grid;grid-template-columns:150px 1fr 60px;align-items:center;gap:14px;padding:9px 12px}
.pb .n{font-size:13.5px;font-weight:700}
.pb .track{height:13px;background:#E7EAF0}
.pb .fill{height:100%;background:var(--p)}
.pb .pc{font-weight:800;color:var(--p);font-size:13px}
@media(max-width:640px){.pb{grid-template-columns:110px 1fr 46px}}
table.rtab{width:100%;border-collapse:collapse;font-size:13px}
.rtab th{background:var(--pl);text-align:right;font-size:12px;color:#4B5160;padding:8px 9px;font-weight:700}
.rtab td.nw,.rtab td.num{white-space:nowrap}
.rtab td{border-bottom:1px solid var(--line);padding:8px 9px;vertical-align:top}
.rtab tr.clk{cursor:pointer}
.rtab tr.clk:hover td{background:#FBF8FC}
.tw{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:var(--pl)}
.kpis div{padding:14px 16px}
.kpis .k{font-size:11.5px;color:var(--mut);font-weight:700}
.kpis .v{font-size:24px;font-weight:800;margin-top:2px}
.kpis .v small{font-size:13px;font-weight:600;color:var(--mut)}
@media(max-width:640px){.kpis{grid-template-columns:1fr 1fr}}
.foot{margin-top:34px;padding-top:12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--mut);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

@media print{
  body{background:#fff}
  .top,.rep-tools,.noprint{display:none!important}
  main{padding:0;max-width:none}
  .rep{box-shadow:none;max-width:none}
  .rs{break-after:avoid}
  .photos figure{break-inside:avoid}
}

/* ===== production additions ===== */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#F5EFF8,#F6F5F8 55%)}
.login{background:#fff;border-top:8px solid var(--p);border-radius:16px;box-shadow:0 8px 30px rgba(60,20,80,.12);width:100%;max-width:400px;padding:28px 26px}
.login .logo{font-family:system-ui,sans-serif;font-weight:800;font-size:38px;color:var(--p);line-height:1}
.login h1{font-size:19px;margin:10px 0 2px}
.login p{margin:0 0 18px;color:var(--mut);font-size:13px}
.login label.f{margin-bottom:12px}
.login .btn{width:100%;justify-content:center;padding:11px}
.err{background:#FDECEA;color:#8A1C14;border-radius:10px;padding:9px 12px;font-size:13.5px;margin-bottom:12px}
.ubox{display:flex;align-items:center;gap:8px;font-size:13px}
.ubox .nm{font-weight:700}
.ubox .rl{font-size:11px;background:var(--pl);color:var(--p);border-radius:99px;padding:1px 8px;font-weight:700}
.loadbar{position:fixed;top:0;left:0;right:0;height:3px;z-index:70;overflow:hidden;opacity:0;transition:opacity .2s}
.loadbar.on{opacity:1}
.loadbar:after{content:"";position:absolute;inset:0;width:40%;background:var(--p2);animation:lb 1s infinite linear}
@keyframes lb{from{transform:translateX(250%)}to{transform:translateX(-100%)}}
.btn.busy{position:relative;color:transparent!important}
.btn.busy:after{content:"";position:absolute;width:16px;height:16px;border:2px solid currentColor;border-color:#fff #fff transparent transparent;border-radius:50%;animation:sp .7s linear infinite;left:calc(50% - 8px);top:calc(50% - 8px)}
.btn:not(.pri).busy:after{border-color:var(--p) var(--p) transparent transparent}
@keyframes sp{to{transform:rotate(360deg)}}
.btn.danger{color:var(--bad);border-color:#F3C5C1}
.sync{font-size:12px;color:var(--mut)}
.offline{background:#FFF4D6;color:#7A5300;text-align:center;font-size:13px;padding:6px}
.ph-ph{width:100%;height:260px;background:#F3F1F5;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px}
.badge-off{font-size:11px;background:#F3F4F6;color:#6B7280;border-radius:99px;padding:1px 8px}
input[type=date]{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff}
</style>
<script src="config.js"></script>
</head>
<body>
<div class="loadbar" id="loadbar"></div>
<div id="login" style="display:none"></div>
<div id="shell" style="display:none">
<header class="top noprint">
  <div class="offline" id="offline" style="display:none">⚠️ لا يوجد اتصال بالخادم — سيُعاد المحاولة تلقائياً</div>
  <div class="top-in">
    <div class="brand"><b>MBCO</b><div><div class="t1">بلاغات الركاب بدون تذاكر</div><div class="t2">العمليات CDC · فريق التفتيش</div></div></div>
    <div class="spacer"></div>
    <div class="ubox" id="ubox"></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="app"></main>
</div>
<div class="toast" id="toast"></div>
<div id="modal"></div>
<script>
/* ================= config ================= */
const CFG = window.CDC_CONFIG || {};
const POLL_MS = (CFG.POLL_SECONDS || 20) * 1000;
const TOKEN_KEY = 'cdc-noticket-session';

const ROLE_NAME = {ops:'عمليات', insp:'مفتش', admin:'إدارة'};
const STATUS = {
  new:{t:'جديد',bg:'#FDECEA',fg:'#B3261E'},
  accepted:{t:'مستلم',bg:'#FFF4D6',fg:'#7A5300'},
  contacted:{t:'تم التواصل',bg:'#E8F0FB',fg:'#1F5FA8'},
  enroute:{t:'في الطريق',bg:'#EDE7F6',fg:'#5B2C91'},
  arrived:{t:'تم الوصول',bg:'#E6F4EC',fg:'#2E7D5B'},
  closed:{t:'مغلق',bg:'#EEF0F3',fg:'#4B5160'},
  cancelled:{t:'ملغى',bg:'#F3F4F6',fg:'#9CA3AF'}
};
const STEPS = [
  ['requested','البلاغ'],['accepted','الاستلام'],['contacted','التواصل مع السائق'],
  ['enroute','التوجه للموقع'],['arrived','الوصول'],['closed','الإغلاق']
];
const OUTCOMES = [
  {k:'valid',  t:'تذكرة فعّالة (خلل في جهاز القارئ)', s:'تذكرة فعّالة', c:'#2E7D5B'},
  {k:'offload',t:'إنزال الراكب', s:'إنزال الراكب', c:'#B26A00'},
  {k:'fine',   t:'تحرير مخالفة', s:'مخالفة', c:'#B3261E'},
  {k:'bought', t:'شراء تذكرة / حل ودي', s:'شراء تذكرة', c:'#1F5FA8'},
  {k:'left',   t:'نزل الراكب قبل وصول المفتش', s:'نزل قبل الوصول', c:'#6B7280'},
  {k:'false',  t:'بلاغ غير صحيح', s:'بلاغ غير صحيح', c:'#9CA3AF'}
];
const REMOTE_OK = ['valid','left','false','bought'];
const OUT = Object.fromEntries(OUTCOMES.map(o=>[o.k,o]));

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const fmtT = t => t ? `${pad(new Date(t).getHours())}:${pad(new Date(t).getMinutes())}` : '—';
const fmtD = t => { const d=new Date(t); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const fmtDT = t => t ? `${fmtD(t)} ${fmtT(t)}:${pad(new Date(t).getSeconds())}` : '—';
const mins = (a,b) => (a&&b) ? Math.max(0,Math.round((b-a)/60000)) : null;
const fmtDur = m => m==null ? '—' : (m<60 ? `${m} د` : `${Math.floor(m/60)} س ${pad(m%60)} د`);
const avg = arr => { const v=arr.filter(x=>x!=null); return v.length ? Math.round(v.reduce((a,b)=>a+b,0)/v.length) : null; };
const arDigits = s => String(s).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
const isOpen = c => !['closed','cancelled'].includes(c.status);
function toast(msg, ms=2400){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),ms); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); }catch(e){} }

/* ================= state ================= */
const S = { token:null, user:null, cases:[], seen:new Set(), loaded:false, filter:'open', q:'', day:fmtD(Date.now()), dayData:null, users:null, photos:{}, lastSync:null, offline:false };
try { const s = JSON.parse(lsGet(TOKEN_KEY)||'null'); if(s){ S.token=s.token; S.user=s.user; } } catch(e){}

/* ================= API ================= */
let pending = 0;
function loading(on){ pending += on?1:-1; $('#loadbar').classList.toggle('on', pending>0); }
async function api(action, data={}, {silent=false}={}){
  if(!CFG.API_URL) throw new Error('لم يتم ضبط رابط الخادم في config.js');
  if(!silent) loading(true);
  try{
    const res = await fetch(CFG.API_URL, { method:'POST', redirect:'follow', body: JSON.stringify({action, token:S.token, ...data}) });
    const j = await res.json();
    if(S.offline){ S.offline=false; renderOffline(); }
    if(!j.ok){ if(j.code==='AUTH' && action!=='login'){ logout(true, j.error); } const e=new Error(j.error||'حدث خطأ'); e.code=j.code; throw e; }
    return j.data;
  } catch(e){
    if(e instanceof TypeError){ S.offline=true; renderOffline(); throw new Error('تعذر الاتصال بالخادم — تحقق من الإنترنت'); }
    throw e;
  } finally { if(!silent) loading(false); }
}
/* run an action from a button with spinner + error toast */
async function run(btn, fn){
  if(btn){ if(btn.classList.contains('busy')) return; btn.classList.add('busy'); btn.disabled=true; }
  try { return await fn(); }
  catch(e){ toast('⚠️ '+e.message, 4000); }
  finally { if(btn && btn.isConnected){ btn.classList.remove('busy'); btn.disabled=false; } }
}

/* ================= sound alert ================= */
let actx=null;
function initAudio(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){} }
function beep(){ if(!actx) return; try{ [0,0.22].forEach(d=>{ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=880; o.connect(g); g.connect(actx.destination);
  g.gain.setValueAtTime(0.0001, actx.currentTime+d); g.gain.exponentialRampToValueAtTime(0.25, actx.currentTime+d+0.02); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+d+0.18);
  o.start(actx.currentTime+d); o.stop(actx.currentTime+d+0.2); }); }catch(e){} }
document.addEventListener('click', initAudio, {once:false, passive:true});

/* ================= board data ================= */
async function refresh(silent){
  try{
    const d = await api('board',{}, {silent});
    const fresh = d.cases.filter(c=>c.status==='new' && !S.seen.has(c.id));
    S.cases = d.cases; S.lastSync = Date.now();
    if(S.loaded && fresh.length && S.user.role!=='ops'){ beep(); toast(`🔴 بلاغ جديد: ${fresh.map(c=>c.caseNo+' · '+c.bus).join('، ')}`, 5000); }
    d.cases.forEach(c=>S.seen.add(c.id)); S.loaded=true;
    if(current==='board' || current==='') { if(!silent || !document.querySelector('#modal .ov')) renderBoard(); }
    renderTabs();
  }catch(e){ if(!silent) toast('⚠️ '+e.message, 4000); }
}

  const today = fmtD(Date.now());

  const nNew = S.cases.filter(c=>c.status==='new').length;

  const closedToday = todays.filter(c=>c.status==='closed').length;
  let list = S.cases.slice();
  if(S.filter==='open') list = list.filter(isOpen);
  if(S.filter==='closed') list = list.filter(c=>!isOpen(c));

function waUpdate(c, step){
  const icon = {accepted:'🟡',contacted:'🔵',enroute:'🟣',arrived:'🟢',closed:'✅',cancelled:'⚪'}[step] || '•';
  const label = {accepted:'تم الاستلام',contacted:'تم التواصل مع السائق',enroute:'المفتش في الطريق',arrived:'تم الوصول',closed: c.remote?'تم الإغلاق (عن بُعد)':'تم الإغلاق',cancelled:'تم إلغاء البلاغ'}[step];
  let m = `${icon} ${c.caseNo} | ${label}

/* ================= actions ================= */
function act(id, a, btn){
  const c = S.cases.find(x=>x.id===id); if(!c) return;

function fileToDataUrl(file, max=1280){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
        const k = Math.min(1, max/Math.max(img.width,img.height));
        const cv = document.createElement('canvas'); cv.width=Math.round(img.width*k); cv.height=Math.round(img.height*k);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        res(cv.toDataURL('image/jpeg',0.75));
      }; img.onerror = rej; img.src = r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

function parseMsg(txt){
  const out = {}; const lines = arDigits(txt).split(/\r?\n/);
  for(const raw of lines){
    const line = raw.replace(/[‎‏*_]/g,'').trim(); const i = line.indexOf(':'); if(i<0) continue;
    const k = line.slice(0,i).trim(), v = line.slice(i+1).trim();
    if(/^رقم الحافلة/.test(k)) out.bus=v.toUpperCase();
    else if(/^الحالة/.test(k)) out.type=v;
    else if(/^رقم المسار/.test(k)) out.route=v;
    else if(/^متجه/.test(k)) out.dest=v;
    else if(/^موقع المحطة/.test(k)){ out.stationUrl=(v.match(/https?:\/\/\S+/)||[v])[0]; const n=k.split(/\s[-–]\s|-/).slice(1).join('-').trim(); if(n) out.stationName=n; }
    else if(/^الرقم الوظيفي/.test(k)) out.driverId=v;
    else if(/^رقم الجوال|^الجوال/.test(k)) out.driverPhone=v.replace(/\D/g,'').replace(/^(966|0)/,'');
    else if(/^مر[حّ]+ل العمليات/.test(k)) out.opsName=v;
  }
  if(!out.stationName && out.dest) out.stationName=out.dest;
  return out;
}

function userBox(u){
  const isNew = !u; u = u || {username:'',name:'',employeeId:'',role:'insp',active:true};
  modal(`<h3>${isNew?'مستخدم جديد':'تعديل: '+esc(u.name)}</h3><div class="sub">${isNew?'أعطِ الموظف اسم المستخدم والرمز المؤقت، وسيغيّره عند أول دخول.':'اترك الرمز فارغاً للإبقاء عليه.'}</div>
    <form id="uf"><div class="grid2">
      <label class="f">الاسم<input name="name" value="${esc(u.name)}" required></label>
      <label class="f">الرقم الوظيفي<input name="employee_id" value="${esc(u.employeeId)}" dir="ltr"></label>
      <label class="f">اسم المستخدم (إنجليزي)<input name="username" value="${esc(u.username)}" ${isNew?'':'readonly'} dir="ltr" autocapitalize="none" placeholder="مثال: f.alotaibi" required></label>
      <label class="f">الدور<select name="role">${Object.entries(ROLE_NAME).map(([k,t])=>`<option value="${k}" ${u.role===k?'selected':''}>${t}</option>`).join('')}</select></label>
      <label class="f">${isNew?'رمز مؤقت (4–8 أرقام)':'رمز جديد (اختياري)'}<input name="pin" inputmode="numeric" dir="ltr" ${isNew?'required':''} placeholder="${isNew?'مثال: 4821':'إعادة تعيين الرمز'}"></label>
      <label class="opt" style="align-self:end;margin:0"><input type="checkbox" name="active" ${u.active?'checked':''}> الحساب نشط</label>
    </div>
    <div class="row" style="margin-top:14px"><button class="btn pri" type="submit">حفظ</button><button class="btn" type="button" data-x>إلغاء</button></div></form>`,
  ov=>{ const f=ov.querySelector('#uf');
    f.onsubmit=e=>{ e.preventDefault();
      const d={isNew, username:f.username.value.trim().toLowerCase(), name:f.name.value.trim(), employee_id:arDigits(f.employee_id.value.trim()), role:f.role.value, pin:arDigits(f.pin.value.trim()), active:f.active.checked};
      run(f.querySelector('[type=submit]'), async()=>{ S.users = await api('saveUser',{user:d}); closeModal(); renderUsers();
        toast(d.pin?`تم الحفظ ✓ — اسم المستخدم: ${d.username} · الرمز: ${d.pin}`:'تم الحفظ ✓', 6000); }); };
  });
}

/* ================= boot ================= */
if(S.token && S.user) start(); else renderLogin();

</script>
</body>
</html>
